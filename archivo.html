<!DOCTYPE html>
<html>
<head>
<title>Contador</title>
<style>
body { background-color: #1e1e1e; color: #ffffff; }
</style>
</head>
<body>

<h1 id="contador">0</h1>
<button onclick="document.getElementById('contador').innerText++">Sumar</button>
<button onclick="document.getElementById('contador').innerText--">Restar</button>

</body>
</html>
